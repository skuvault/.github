name: Merge a branch into another via PR

on:
  workflow_call:
    inputs:
      source-branch:
        required: true
        type: string
      target-branch:
        required: true
        type: string

jobs:
  create-and-merge-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      result-message: ${{steps.merge-pull-request.outputs.RESULT_MESSAGE}}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create pull request
      run: |
        PR_URL=$(gh pr create --base ${{ inputs.target-branch }} --head ${{ inputs.source-branch }} --title "Auto-generated PR" --body "This PR was created via Github Actions ")
        echo "::set-output name=pr_url::$PR_URL"

    - name: Merge pull request
      id: merge-pull-request
      if: success()
      run: |
        if gh pr merge ${{ steps.create-pull-request.outputs.pr_url }} --merge --admin --body "Auto-merged via Github Actions"; then
          echo "RESULT_MESSAGE=Completed successfully" >> "$GITHUB_OUTPUT"
          echo "Job completed successfully"
        else
          echo "RESULT_MESSAGE=Failed" >> "$GITHUB_OUTPUT"
          echo "Job failed"
        fi
